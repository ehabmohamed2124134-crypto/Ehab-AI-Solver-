
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b35">
<title>Ehab AI Solver</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101b35;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:24px 12px;background:#172746}
h1{color:#62d9ff}
main{max-width:650px;margin:auto;padding:15px}
.card{background:#1b2d4c;padding:18px;border-radius:16px;margin:15px 0}
p{line-height:1.8;color:#dce8f7}
button,.upload{display:block;width:100%;padding:14px;margin-top:12px;border:0;border-radius:11px;background:#16b9dc;color:#071629;font-size:16px;font-weight:bold;text-align:center}
.secondary{background:#e0eaff}
input[type=file]{display:none}
textarea{width:100%;min-height:140px;padding:12px;font-size:17px;border-radius:10px}
#preview{display:none;width:100%;margin-top:15px;border-radius:10px}
#status{white-space:pre-wrap}
.small{font-size:13px}
</style>
</head>
<body>
<header>
<div style="font-size:42px">📸 🧠</div>
<h1>Ehab AI Solver</h1>
<p>صوّر السؤال وحوّل الصورة إلى نص</p>
</header>
<main>
<section class="card">
<h2>📷 صورة الامتحان</h2>
<label class="upload" for="camera">فتح الكاميرا</label>
<input id="camera" type="file" accept="image/*" capture="environment">
<label class="upload secondary" for="gallery">اختيار صورة من المعرض</label>
<input id="gallery" type="file" accept="image/*">
<img id="preview" alt="صورة السؤال">
<button id="read">📝 اقرأ الأسئلة من الصورة</button>
<p id="status">اختار صورة واضحة، ثم اضغط اقرأ الأسئلة.</p>
</section>

<section class="card">
<h2>النص المستخرج</h2>
<textarea id="question" placeholder="النص المقروء سيظهر هنا..."></textarea>
<button id="save">حفظ النص</button>
<button id="restore" class="secondary">استرجاع النص المحفوظ</button>
</section>

<section class="card">
<h2>🧠 الحل</h2>
<p>قارئ الصور يستخرج النص فقط. لم نضف بعد نموذج ذكاء اصطناعي يحل الأسئلة تلقائيًا.</p>
<p class="small">اختبر النص المستخرج وصحّح أي أرقام أو كلمات قرأها بشكل خاطئ.</p>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const camera=document.getElementById('camera');
const gallery=document.getElementById('gallery');
const preview=document.getElementById('preview');
const question=document.getElementById('question');
const status=document.getElementById('status');
let selectedImage=null;

function chooseImage(file){
 if(!file)return;
 if(!file.type.startsWith('image/')){
  status.textContent='اختار ملف صورة صحيح.';
  return;
 }
 selectedImage=file;
 preview.src=URL.createObjectURL(file);
 preview.style.display='block';
 status.textContent='الصورة جاهزة. اضغط اقرأ الأسئلة.';
}
camera.onchange=e=>chooseImage(e.target.files[0]);
gallery.onchange=e=>chooseImage(e.target.files[0]);

document.getElementById('read').onclick=async()=>{
 if(!selectedImage){
  status.textContent='اختار صورة الأول.';
  return;
 }
 if(!window.Tesseract){
  status.textContent='تعذر تحميل قارئ الصور. اتصل بالإنترنت ثم أعد فتح الموقع.';
  return;
 }
 try{
  status.textContent='جاري تحميل ملفات قراءة اللغة... انتظر.';
  const worker=await Tesseract.createWorker('ara+eng',1,{
   logger:m=>{
    if(m.status)status.textContent=m.status+
      (m.progress!==undefined?' '+Math.round(m.progress*100)+'%':'');
   }
  });
  const result=await worker.recognize(selectedImage);
  question.value=result.data.text;
  await worker.terminate();
  status.textContent=question.value.trim()
   ?'تم استخراج النص. راجع الأرقام والكلمات للتأكد من دقتها.'
   :'لم يتم التعرف على نص واضح. جرّب صورة أوضح.';
 }catch(error){
  status.textContent='حدث خطأ أثناء القراءة. تأكد من الإنترنت وجرّب صورة أوضح.';
 }
};

document.getElementById('save').onclick=()=>{
 try{
  localStorage.setItem('ehab_exam_question',question.value);
  status.textContent='تم حفظ النص على الجهاز.';
 }catch(e){status.textContent='تعذر الحفظ.';}
};
document.getElementById('restore').onclick=()=>{
 question.value=localStorage.getItem('ehab_exam_question')||'';
 status.textContent=question.value?'تم استرجاع النص.':'لا يوجد نص محفوظ.';
};
</script>
</body>
</html>
